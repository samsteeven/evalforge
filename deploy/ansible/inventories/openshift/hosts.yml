---
# OpenShift : se connecter d'abord (oc login), choisir le projet (oc project evalforge) ; Ansible utilise le
# kubeconfig ainsi préparé. PostgreSQL et RabbitMQ sont des services existants (managés ou opérateurs).
evalforge:
  hosts:
    localhost:
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
