apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalforge-frontend
  labels:
    app.kubernetes.io/name: evalforge-frontend
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: evalforge-frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: evalforge-frontend }
    spec:
      automountServiceAccountToken: false
      # Pas de variables *_PORT injectées pour chaque Service : elles entrent en collision (SUPPORT_AGENT_PORT).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: evalforge-frontend
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: EVALFORGE_API_UPSTREAM
              value: http://evalforge-api:8000
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # Configuration rendue au démarrage (EVALFORGE_API_UPSTREAM), racine en lecture seule.
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: nginx-conf, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: evalforge-frontend
  labels:
    app.kubernetes.io/name: evalforge-frontend
spec:
  selector: { app.kubernetes.io/name: evalforge-frontend }
  ports:
    - { name: http, port: 8080, targetPort: http }
