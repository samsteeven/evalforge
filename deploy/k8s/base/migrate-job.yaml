# Migrations Alembic, avant le déploiement des nouvelles versions de l'API et du worker.
apiVersion: batch/v1
kind: Job
metadata:
  name: evalforge-migrate
  labels:
    app.kubernetes.io/name: evalforge-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evalforge-migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      # Pas de variables *_PORT injectées pour chaque Service : elles entrent en collision (SUPPORT_AGENT_PORT).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: evalforge-backend
          command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: evalforge-config }
            - secretRef: { name: evalforge-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
