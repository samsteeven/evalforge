apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalforge-worker
  labels:
    app.kubernetes.io/name: evalforge-worker
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: evalforge-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: evalforge-worker }
    spec:
      automountServiceAccountToken: false
      # Pas de variables *_PORT injectées pour chaque Service : elles entrent en collision (SUPPORT_AGENT_PORT).
      enableServiceLinks: false
      # Un worker arrêté rend ses messages à RabbitMQ ; un autre reprend les réponses manquantes (ADR-022).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: evalforge-backend
          command: ["evalforge-worker"]
          envFrom:
            - configMapRef: { name: evalforge-config }
            - secretRef: { name: evalforge-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
