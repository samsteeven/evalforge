apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-llm
  labels:
    app.kubernetes.io/name: fake-llm
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: fake-llm }
  template:
    metadata:
      labels: { app.kubernetes.io/name: fake-llm }
    spec:
      automountServiceAccountToken: false
      # Pas de variables *_PORT injectées pour chaque Service : elles entrent en collision (SUPPORT_AGENT_PORT).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: fake-llm
          image: evalforge-backend
          command:
            - python
            - -c
            - "import runpy, uvicorn; uvicorn.run(runpy.run_path('scripts/fake_llm.py')['app'], host='0.0.0.0', port=8100)"
          ports:
            - { name: http, containerPort: 8100 }
          readinessProbe:
            httpGet: { path: /docs, port: http }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: fake-llm
  labels:
    app.kubernetes.io/name: fake-llm
spec:
  selector: { app.kubernetes.io/name: fake-llm }
  ports:
    - { name: http, port: 8100, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-agent
  labels:
    app.kubernetes.io/name: support-agent
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: support-agent }
  template:
    metadata:
      labels: { app.kubernetes.io/name: support-agent }
    spec:
      automountServiceAccountToken: false
      # Pas de variables *_PORT injectées pour chaque Service : elles entrent en collision (SUPPORT_AGENT_PORT).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: support-agent
          image: evalforge-backend
          command: ["evalforge-support-agent"]
          env:
            - { name: SUPPORT_AGENT_HOST, value: 0.0.0.0 }
            - { name: SUPPORT_AGENT_LLM_BASE_URL, value: "http://fake-llm:8100/v1" }
          ports:
            - { name: http, containerPort: 8200 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: support-agent
  labels:
    app.kubernetes.io/name: support-agent
spec:
  selector: { app.kubernetes.io/name: support-agent }
  ports:
    - { name: http, port: 8200, targetPort: http }
---
# L'agent n'est appelé que par les workers ; le faux fournisseur, par les workers et par l'agent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: support-agent-from-worker
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: support-agent }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: evalforge-worker }
      ports:
        - { port: 8200, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fake-llm-from-worker-and-agent
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: fake-llm }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [evalforge-worker, support-agent]
      ports:
        - { port: 8100, protocol: TCP }
