[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
# L'URL vient de EVALFORGE_DATABASE_URL (voir migrations/env.py), ou de sqlalchemy.url posée par le code appelant.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
