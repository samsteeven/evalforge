[project]
name = "evalforge-support-agent"
version = "0.1.0"
description = "Agent de support client à outils, construit pour être évalué par EvalForge"
requires-python = ">=3.13"
dependencies = [
    "evalforge-llm-gateway",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
]

[project.scripts]
evalforge-support-agent = "support_agent.app:main"

[tool.uv.sources]
evalforge-llm-gateway = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "support_agent"
