[project]
name = "evalforge-llm-gateway"
version = "0.1.0"
description = "Appels normalisés aux fournisseurs de modèles (API compatible OpenAI, Ollama)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "opentelemetry-api>=1.30",
    "pydantic>=2.10",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "evalforge_llm"
