[project]
name = "evalforge-engine"
version = "0.1.0"
description = "Moteur d'évaluation : contrats, évaluateurs, orchestration et agrégats"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "evalforge-llm-gateway",
    "jinja2>=3.1",
]

[tool.uv.sources]
evalforge-llm-gateway = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "evalforge_engine"
