name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Dépendances
        run: uv sync --locked

      - name: Lint et format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests (PostgreSQL réel via Testcontainers)
        run: uv run pytest -q

      - name: Migrations à jour avec les modèles
        run: |
          docker run -d --name pg --tmpfs /var/lib/postgresql:rw -e POSTGRES_USER=evalforge -e POSTGRES_PASSWORD=evalforge \
            -e POSTGRES_DB=evalforge -p 5435:5432 postgres:18-alpine
          until docker exec pg pg_isready -U evalforge -d evalforge; do sleep 1; done
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini check

      - name: Porte de qualité de la CLI (le modèle vague doit être bloqué)
        run: |
          uv run python scripts/fake_llm.py 8100 &
          until curl -sf http://127.0.0.1:8100/docs > /dev/null; do sleep 1; done
          set +e
          uv run evalforge run examples/support-faq/evalforge.yaml --report rapport-cli.html
          code=$?
          set -e
          test "$code" -eq 1 || { echo "code de sortie attendu : 1, obtenu : $code"; exit 1; }
          grep -q "Juge (judge)" rapport-cli.html

      - name: Contrat OpenAPI du front à jour
        run: |
          uv run python -m evalforge_api.openapi_export frontend/openapi.json
          git diff --exit-code frontend/openapi.json

  adapters:
    # Ragas et DeepEval ne cohabitent pas : chacun dans son environnement, contre la vraie bibliothèque.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        library: [ragas, deepeval]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Dépendances (groupe ${{ matrix.library }})
        run: uv sync --locked --group ${{ matrix.library }}

      - name: Adaptateur ${{ matrix.library }}
        run: uv run --group ${{ matrix.library }} pytest -q packages/evaluation_engine/tests/test_adapter_${{ matrix.library }}.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      CYPRESS_INSTALL_BINARY: 0 # pas de navigateur pour ce job
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Types du client générés depuis le contrat
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.d.ts

      - name: Types, lint, tests, construction
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVALFORGE_DATABASE_URL: postgresql+asyncpg://evalforge:evalforge@localhost:5435/evalforge
      EVALFORGE_RABBITMQ_URL: amqp://evalforge:evalforge@localhost:5672/
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: PostgreSQL, RabbitMQ et migrations
        run: |
          docker run -d --name pg --tmpfs /var/lib/postgresql:rw -e POSTGRES_USER=evalforge -e POSTGRES_PASSWORD=evalforge \
            -e POSTGRES_DB=evalforge -p 5435:5432 postgres:18-alpine
          docker run -d --name rabbit --tmpfs /var/lib/rabbitmq:rw -e RABBITMQ_DEFAULT_USER=evalforge \
            -e RABBITMQ_DEFAULT_PASS=evalforge -p 5672:5672 rabbitmq:4.4-alpine
          uv sync --locked
          until docker exec pg pg_isready -U evalforge -d evalforge; do sleep 1; done
          until docker logs rabbit 2>&1 | grep -q "Server startup complete"; do sleep 1; done
          uv run alembic -c apps/api/alembic.ini upgrade head

      - name: Parcours Cypress (faux fournisseur, API, worker, front)
        working-directory: frontend
        run: |
          npm ci
          npm run e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 7
