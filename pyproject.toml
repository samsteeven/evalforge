[project]
name = "evalforge"
version = "0.1.0"
description = "Plateforme d'évaluation d'applications LLM, RAG et agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["evalforge-api", "evalforge-cli", "evalforge-engine", "evalforge-llm-gateway", "evalforge-support-agent"]

[tool.uv]
package = false
# Ragas et DeepEval ne cohabitent pas : ensemble, DeepEval redescend de 4.x à 2.9. Un groupe ou l'autre.
conflicts = [[{ group = "ragas" }, { group = "deepeval" }]]

[tool.uv.workspace]
members = ["apps/api", "apps/cli", "apps/support_agent", "packages/evaluation_engine", "packages/llm_gateway"]

[tool.uv.sources]
evalforge-api = { workspace = true }
evalforge-cli = { workspace = true }
evalforge-support-agent = { workspace = true }
evalforge-engine = { workspace = true }
evalforge-llm-gateway = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.9",
]
# Adaptateurs optionnels : uv sync --group ragas, ou uv sync --group deepeval.
# Ragas 0.4.3 importe un module retiré de langchain-community 0.4 : version bornée.
ragas = ["ragas>=0.4.3,<0.5", "langchain-community<0.4"]
deepeval = ["deepeval>=4.3,<5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
pythonpath = ["apps/api/tests", "packages/evaluation_engine/tests"]
testpaths = ["packages/llm_gateway/tests", "packages/evaluation_engine/tests", "apps/cli/tests", "apps/support_agent/tests", "apps/api/tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF", "SIM"]
# RUF001-003 : guillemets et apostrophes typographiques des messages en français.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["evalforge_api", "evalforge_cli", "support_agent", "evalforge_engine", "evalforge_llm", "helpers", "adapter_support"]

[tool.ruff.lint.per-file-ignores]
# Les tests attendent l'état d'un run en interrogeant l'API, comme le ferait un client.
"**/tests/**" = ["S", "ASYNC109", "ASYNC110"]
"**/migrations/**" = ["E501"]
